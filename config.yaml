# ═══════════════════════════════════════════════════════════════
# Cortex Configuration
# Copy to ~/.cortex/config.yaml and edit with your values.
# ═══════════════════════════════════════════════════════════════

server:
  port: 7800
  host: "127.0.0.1"               # localhost only (security)

database:
  # Local-first: SQLite is the source of truth, so Cortex works with Tailscale
  # OFF (e.g. on a college network that blocks VPNs). The Postgres block below is
  # the OPTIONAL sync target, used only when the server is reachable (see sync.py).
  backend: "sqlite"                # sqlite | postgres
  sqlite_path: "~/.cortex/cortex.db"
  host: "100.100.35.38"
  port: 5435
  name: "postgres"
  user: "postgres.your-tenant-id"  # Supavisor tenant format
  password: ""                     # from macOS Keychain / ~/.cortex/cortex.env; never commit

llm:
  # 100% local via Ollama. No API keys are ever read for LLM calls.
  # gemma4-agent:12b-mlx is the measured agentic winner: with the full system
  # prompt + tools it calls tools 3/3; gemma4:e4b scored 0/3 (it drowns in the
  # long prompt). The 12b MLX build is also SMALLER than e4b (7.7GB vs 9.6GB),
  # so this is both more capable AND lighter. This is what lets Cortex actually
  # complete multi-step jobs.
  ollama:
    base_url: "http://localhost:11434"
    model: "gemma4-agent:12b-mlx"  # agentic/tool-use tuned, 7.7GB, fits 24GB
    timeout: 90                    # 12b local inference needs more headroom
  ollama_fallback:
    base_url: "http://localhost:11434"
    model: "gemma4:12b-mlx"        # also 3/3 on tool-calling; same size

context:
  max_age_minutes: 30              # context stays valid for 30 min
  include_categories:
    - git
    - process
    - system
    - shell
    - project
    - metrics
    - server
    - github
    - owner

memory:
  max_facts: 100
  summarize_every: 50              # summarize conversation every N messages
  retention_days: 90

reminders:
  check_interval_seconds: 30
  notification_method: "both"      # macos_notification | say | both

# ─── Autonomy — goal-directed background cognition ───
# Runs on its own schedule, no prompt needed. Anything that would need
# confirmation in a live /ask (safety.py) gets queued as a proposal +
# notification instead of auto-executed — see autonomy.py.
autonomy:
  enabled: true
  interval_minutes: 15          # (legacy thread model) — scheduled model uses the launchd StartInterval
  max_actions_per_hour: 4       # DB-backed rate cap, enforced across wake-run-exit runs
  max_steps_per_wake: 4         # multi-step planner: max plan→act→observe steps per wake
  notify_on_action: true

projects:
  - path: "/Users/niranjan/Documents/projects/smart-terminal"
    name: "smart-terminal"
  # Add more:
  # - path: "/Users/niranjan/Projects/api"
  #   name: "api"

appflowy:
  base_url: "https://beta.appflowy.cloud"
  email: ""                        # your AppFlowy account email
  password: ""                     # or set via env: APPFLOWY_PASSWORD
  token: ""                        # alternative: paste a token directly
  workspace_id: ""                 # fill after running: cx setup-appflowy
  todo_database_id: ""             # fill after running: cx setup-appflowy

# ─── Web Credentials (for authenticated crawling) ───
# Each entry is a named credential set the LLM can reference.
# auth_type: form | bearer | basic | header | cookie
web_credentials:
  # Example: form-based login
  # jira:
  #   auth_type: form
  #   login_url: "https://yourcompany.atlassian.net/login"
  #   username_field: "email"
  #   password_field: "password"
  #   username: "you@company.com"
  #   password: ""              # set via env: CORTEX_CRED_JIRA_PASSWORD
  #   extra_fields: {}

  # Example: bearer token (APIs, dashboards)
  # grafana:
  #   auth_type: bearer
  #   token: ""                 # set via env: CORTEX_CRED_GRAFANA_TOKEN

  # Example: basic auth
  # router:
  #   auth_type: basic
  #   username: "admin"
  #   password: ""              # set via env: CORTEX_CRED_ROUTER_PASSWORD

  # Example: custom headers (API keys)
  # internal_api:
  #   auth_type: header
  #   headers:
  #     X-API-Key: ""           # set via env: CORTEX_CRED_INTERNAL_API_KEY

  # Example: pre-set cookies
  # legacy_app:
  #   auth_type: cookie
  #   cookies:
  #     session_id: "abc123"

# ─── Multi-machine (Tailscale SSH) ───
remote_hosts:
  server:
    ip: "100.100.35.38"
    user: "rathinaswamy"
    key: "~/.ssh/id_ed25519_myserver"
  # Add more:
  # nas:
  #   ip: "100.x.x.x"
  #   user: "admin"

# ─── Automation Rules ───
automation_rules:
  - name: "High CPU"
    condition:
      type: metric_threshold
      metric: host_cpu
      operator: ">"
      threshold: 80
    action:
      type: notify
      message: "CPU is above 80 percent"
    cooldown_minutes: 15

  - name: "Disk almost full"
    condition:
      type: metric_threshold
      metric: host_disk
      operator: ">"
      threshold: 90
    action:
      type: say
      message: "Niranjan, your disk is almost full. You should free up some space."
    cooldown_minutes: 60

  - name: "Hotel mapping worker crashed"
    condition:
      type: container_status
      container: hotel_mapping_worker_v2
      status: exited
    action:
      type: restart_container
      container: hotel_mapping_worker_v2
    cooldown_minutes: 30

# ─── Scheduled Reports ───
scheduled_reports:
  - name: "Morning Briefing"
    hour: 9
    minute: 0
    prompt: "Give me a quick morning briefing. System health, any container issues overnight, git changes across my projects, and my calendar for today."
    delivery: both

  - name: "Evening Wrap"
    hour: 18
    minute: 0
    prompt: "Quick evening summary. What happened today on the system, any issues, and what's on my calendar tomorrow."
    delivery: notify
